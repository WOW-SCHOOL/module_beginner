/* Block 4 — Family Memory: no scrolling, 4×4 flip-card board */
.memoryQuestion{overflow:hidden}
.memoryQuestion .prompt{font-size:30px;margin-top:5px}
.memoryQuestion .matchIntro{margin-top:6px;font-size:14px;line-height:1.3}
.memoryBoard{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:9px;margin-top:12px;perspective:1000px}
.memoryCard{position:relative;min-width:0;min-height:0;border:0;background:transparent;padding:0;cursor:pointer;perspective:900px}
.memoryCard:disabled{cursor:default}
.memoryInner{position:absolute;inset:0;display:block;transform-style:preserve-3d;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.memoryCard.revealed .memoryInner,.memoryCard.solved .memoryInner{transform:rotateY(180deg)}
.memoryBack,.memoryFront{position:absolute;inset:0;border-radius:15px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.memoryBack{border:1px solid #d8e5f7;background:linear-gradient(145deg,#eef7ff,#f7f1ff 58%,#fff8ef);box-shadow:inset 0 1px 0 #fff,0 5px 12px rgba(43,70,122,.08);color:#3d69a8}
.memoryBack::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(86,127,191,.2);border-radius:11px}
.memoryIcon{font-size:23px;line-height:1;filter:saturate(.9)}
.memoryBack small{font-size:8px;letter-spacing:.08em;font-weight:900;margin-top:4px;opacity:.7}
.memoryFront{transform:rotateY(180deg);border:1px solid #dbe7f6;background:#fff;padding:7px 8px;box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(43,70,122,.07)}
.memoryFront.en{background:linear-gradient(160deg,#f5f9ff,#e9f5ff)}
.memoryFront.ru{background:linear-gradient(160deg,#fff8f5,#fff0f7)}
.memoryFront small{font-size:8px;letter-spacing:.12em;font-weight:950;color:#6f8ab5;margin-bottom:4px}
.memoryFront strong{font-size:15px;line-height:1.08;color:#16346d;font-weight:950;overflow-wrap:anywhere}
.memoryCard.solved .memoryFront{border-color:#52cd8d;background:linear-gradient(160deg,#edfff4,#ddfae9)}
.memoryCard.solved .memoryFront strong{color:#148749}
.memoryCard.wrong .memoryFront{border-color:#ef8191;background:#fff1f3;animation:memoryShake .3s linear}
@keyframes memoryShake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-3px)}75%{transform:rotateY(180deg) translateX(3px)}}
.memoryQuestion .statusWrap{margin-top:9px;padding-top:7px}
.memoryQuestion .feedbackBox{min-height:38px;padding:9px 14px}
.memoryQuestion .internalProgress{margin-top:7px}

/* ===== Unit 4B additions ===== */
:root{--ink:#14346e;--blue:#2f91f2;--cyan:#1bc3c6;--violet:#8f55f5;--muted:#657da8;--line:#dbe6f5;--soft:#f6f9ff;--good:#20b970;--bad:#f06b72}
.questionCard{display:grid!important;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0;overflow:hidden}
.answers{min-height:0;overflow:auto;align-content:start}
.statusWrap{margin-top:10px;padding-top:10px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 28%);position:relative;z-index:4}
.internalProgress{flex:0 0 auto}
.visualSlot img,.readingSlot img,.heroSlot img{object-fit:contain!important;object-position:center center!important}
.visualSlot,.readingSlot,.heroSlot{overflow:hidden}

.sortWrap{height:100%;display:flex;flex-direction:column;min-height:0}
.sortBank{display:flex;flex-wrap:wrap;gap:10px;padding:10px;border-radius:18px;background:#f6f9ff;border:1px solid #dce7f7;min-height:86px;align-content:flex-start}
.sortChip{border:1px solid #d4e3f8;background:white;color:#17366d;border-radius:16px;padding:10px 14px;font-weight:900;font-size:16px;box-shadow:0 5px 16px rgba(38,80,140,.08);cursor:grab;user-select:none}
.sortChip.selected{outline:3px solid rgba(47,145,242,.22);border-color:#2f91f2}
.sortChip.good{background:#eafff3;border-color:#4ed48d;color:#13864b;cursor:default}
.sortColumns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;min-height:0;margin-top:12px}
.sortCol{border:1px dashed #bcd4ef;background:linear-gradient(180deg,#fbfdff,#f2f7ff);border-radius:20px;padding:12px;display:flex;flex-direction:column;min-height:0}
.sortCol h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#3e79c8;margin:0 0 10px;font-weight:950}
.sortDrop{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;overflow:auto}
.sortCol.hot{box-shadow:inset 0 0 0 3px rgba(47,145,242,.18)}

.builderWrap{display:flex;flex-direction:column;min-height:0;height:100%}
.builderCue{border-radius:18px;background:linear-gradient(180deg,#f9fbff,#f3f7ff);border:1px solid #dbe6f5;padding:14px 16px;color:#5a719d;font-size:15px;font-weight:800}
.builderResult{min-height:72px;border-radius:20px;border:1px solid #cfe0f4;background:white;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;margin:14px 0}
.tokenBank{display:flex;flex-wrap:wrap;gap:10px;min-height:0;overflow:auto;padding:4px}
.token{border:1px solid #d4e3f8;background:#f7faff;color:#17366d;border-radius:15px;padding:11px 14px;font-size:17px;font-weight:900;cursor:pointer}
.token.used{opacity:.35;pointer-events:none}
.token.answerToken{background:#eef7ff;border-color:#9cc8f5}
.builderActions{display:flex;gap:10px;margin-top:auto;padding-top:10px}
.smallBtn{border:0;border-radius:16px;padding:11px 16px;font-weight:900;cursor:pointer;background:#eef4ff;color:#1e5fa8}
.smallBtn.primary{background:linear-gradient(90deg,#24c6c9,#2f91f2);color:white}

.readingVisual.portrait{display:grid;grid-template-columns:36% 64%;gap:14px;height:100%;min-height:0}
.readingVisual.portrait .readingArtFrame{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.readingVisual.portrait .readingSlot{height:100%;width:100%;background:#f5f8ff;border-radius:20px}
.readingVisual.portrait .readingSlot img{width:100%;height:100%;object-fit:contain!important}
.readingVisual.portrait .readText{font-size:14.5px;line-height:1.34;overflow:auto}

.driveLayout{display:grid;grid-template-columns:1.04fr .96fr;gap:18px;height:100%;min-height:0}
.driveBoard{background:linear-gradient(145deg,#edf7ff,#f8f2ff);border:1px solid #dbe6f5;border-radius:24px;padding:16px;display:flex;flex-direction:column;min-height:0}
.road{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;flex:1;min-height:0}
.roadCell{position:relative;border-radius:18px;background:white;border:1px solid #d6e5f6;display:flex;align-items:center;justify-content:center;font-weight:950;color:#5d78a5;box-shadow:0 4px 12px rgba(40,74,130,.05)}
.roadCell.finish{background:#eafff3;color:#188c52}
.carToken{position:absolute;font-size:34px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));animation:bump .3s ease}
@keyframes bump{50%{transform:scale(1.14)}}
.diceBar{display:flex;align-items:center;gap:12px;margin-top:12px}
.dice{font-size:44px;line-height:1}
.rollBtn{border:0;border-radius:18px;padding:12px 18px;background:linear-gradient(90deg,#8c55f5,#2f91f2);color:#fff;font-weight:950;font-size:16px;cursor:pointer}
.rollBtn:disabled{opacity:.4;cursor:not-allowed}
.driveChallenge{background:#fff;border:1px solid #dbe6f5;border-radius:24px;padding:18px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0}
.driveTokens{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;overflow:auto;padding-top:12px}

@media (max-width:900px){.sortColumns{grid-template-columns:1fr}.driveLayout{grid-template-columns:1fr}.readingVisual.portrait{grid-template-columns:38% 62%}}


/* ===== Unit 5A · Block 8 only: open-card Breakfast Match ===== */
.pairOnlyCard{height:100%;min-height:0;background:#fff;border:1px solid #dbe6f5;border-radius:28px;padding:18px;display:flex;flex-direction:column;box-shadow:0 16px 34px rgba(48,72,129,.08)}
.pairOnlyIntro{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex:0 0 auto}
.pairOnlyIntro .prompt{font-size:30px;line-height:1.05;margin-top:5px}
.pairOnlyIntro .subprompt{font-size:14px;line-height:1.35;margin-top:7px;color:var(--muted);font-weight:780;max-width:980px}
.pairLegend{display:flex;gap:8px;flex:0 0 auto;padding-top:5px}
.pairLegend span{padding:8px 13px;border-radius:999px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:950;border:1px solid #dbe6f5}

.pairOpenGrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:9px;margin-top:14px}
.pairOpenCard{min-width:0;min-height:0;border-radius:16px;border:1px solid #dbe6f5;padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 5px 12px rgba(43,70,122,.06);transition:border-color .14s,box-shadow .14s,background .14s}
.pairOpenCard.en{background:linear-gradient(160deg,#f6fbff,#eaf5ff);color:#16346d}
.pairOpenCard.ru{background:linear-gradient(160deg,#fff8ff,#f6efff);color:#5f3a94}
.pairOpenCard:hover:not(:disabled){border-color:#78b5f3;box-shadow:0 0 0 3px rgba(84,163,247,.12),0 6px 14px rgba(43,70,122,.08)}
.pairOpenCard.active{border-color:#4c98ef;box-shadow:0 0 0 3px rgba(84,163,247,.22),0 8px 16px rgba(43,70,122,.10)}
.pairOpenCard.done{border-color:#50ce8a;background:linear-gradient(160deg,#edfff4,#ddfae9);color:#148749;cursor:default}
.pairOpenCard small{display:block;font-size:8px;letter-spacing:.11em;font-weight:950;opacity:.62;margin-bottom:4px}
.pairOpenCard strong{display:block;font-size:15px;line-height:1.08;font-weight:950;overflow-wrap:anywhere}
.pairOnlyStatus{flex:0 0 auto;margin-top:10px}
.pairOnlyStatus .feedbackBox{min-height:38px;padding:8px 13px}
.pairOnlyStatus .internalProgress{margin-top:7px}


.errorSteps{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.stepPill{padding:8px 14px;border-radius:999px;background:#eef4ff;border:2px solid #d9e6ff;color:#6880ad;font-weight:800;font-size:22px}
.stepPill.active{background:#f6fbff;border-color:#9ec5ff;color:#2f66d0}
.errorSentence{display:flex;flex-wrap:wrap;gap:12px;min-height:86px;padding:18px;border:2px solid #9fe0b3;border-radius:24px;background:#f3fff7}
.errorToken.selected{outline:4px solid #9ec5ff;transform:none}
.errorToken.correct{background:#dff8e7;border-color:#65d28b;color:#107c44}
.fixOptions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.smallAnswer{padding:14px 18px;min-width:120px}


/* Unit 5B v2 — Error Hunter stable layout */
.errorQuestion{display:flex!important;flex-direction:column;min-height:0;overflow:hidden}
.errorQuestion .prompt{flex:0 0 auto}
.errorQuestion .subprompt{flex:0 0 auto;margin-bottom:12px}
.errorWork{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.errorSentence{flex:0 0 auto;min-height:92px;display:flex;flex-wrap:wrap;gap:10px;align-content:center;padding:18px 20px;border:2px solid #d7e6f6;border-radius:22px;background:linear-gradient(180deg,#f9fcff,#f4f8ff)}
.errorSentence.solved{border-color:#65d28b;background:#effff5}
.errorWord{border:1px solid #d4e3f8;background:#fff;color:#17366d;border-radius:15px;padding:12px 16px;font-size:18px;font-weight:950;cursor:pointer;box-shadow:0 4px 10px rgba(43,70,122,.06);transition:.14s}
.errorWord:hover:not(:disabled){border-color:#6aaaf0;background:#f2f8ff}
.errorWord.selected{border-color:#2f91f2;background:#eaf5ff;box-shadow:0 0 0 3px rgba(47,145,242,.16)}
.errorWord.correct{border-color:#4fce89;background:#eafff1;color:#148749}
.replacementArea{flex:1 1 auto;min-height:150px;border:1px solid #e1eaf6;border-radius:20px;background:#fbfdff;padding:18px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.replacementArea.show{justify-content:flex-start}
.replaceHint{font-size:16px;color:#7b8dac;font-weight:800}
.replaceLabel{font-size:16px;color:#5c7096;font-weight:800;margin-bottom:13px}
.fixOptions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.fixChoice{min-height:58px;border-radius:17px;border:1px solid #d9e5f5;background:linear-gradient(180deg,#fff,#f3f8ff);color:#17336b;font-size:18px;font-weight:950;cursor:pointer;padding:10px 14px;transition:.14s}
.fixChoice:hover{border-color:#76b1f4;background:#eef7ff}
.fixChoice.wrongFlash{border-color:#ee8090;background:#fff0f2;color:#bd4052;animation:shake .22s linear}
#errorModel:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.errorQuestion .statusWrap{flex:0 0 auto;margin-top:12px}


/* WOW SCHOOL universal text-safety rule — never crop task text */
.questionCard, .questionCard *{min-width:0;box-sizing:border-box}
.prompt,.subprompt,.answer,.token,.errorWord,.fixChoice,.sortToken,.pairOpenCard,.replaceHint,.replaceLabel,.feedbackBox,.builderCue,.nextBtn,.audioBtn,.smallBtn{
  overflow-wrap:anywhere;
  word-break:normal;
  hyphens:auto;
}
.answer,.fixChoice,.errorWord,.token,.sortToken,.pairOpenCard{
  white-space:normal;
  height:auto;
  line-height:1.16;
}
.answer{min-height:52px;padding:10px 18px;font-size:clamp(15px,1.06vw,17px)}
.token,.errorWord{font-size:clamp(14px,1.04vw,17px);padding:10px 13px}
.fixChoice{min-height:56px;padding:10px 12px;font-size:clamp(14px,1.04vw,17px);display:flex;align-items:center;justify-content:center;text-align:center}
.fixOptions{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
.replacementArea{min-height:0;overflow:auto}
.replaceHint,.replaceLabel{line-height:1.25}
.errorSentence{max-height:150px;overflow:auto}
.statusWrap,.feedbackBox{min-width:0}
.feedbackBox{white-space:normal;line-height:1.2}
.nextBtn,.audioBtn,.smallBtn{white-space:normal;line-height:1.12}

/* Compact only when a right-side task has unusually long content. */
.questionCard .answers:has(.answer:nth-child(5)),
.questionCard .fixOptions:has(.fixChoice:nth-child(3)){gap:8px}

.answer,.fixChoice,.sortChip,.token,.smallBtn,.btn,.audioBtn,.nextBtn,.errorWord{white-space:normal;word-break:break-word;overflow-wrap:anywhere}
.fixOptions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.replacementArea{min-height:118px}
.errorSentence{align-items:flex-start}
.heroFeatures{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 10px}

.content{padding:28px 34px 24px}

let playToken=0;const ttsAudio=document.createElement('audio');ttsAudio.preload='auto';ttsAudio.setAttribute('playsinline','');ttsAudio.referrerPolicy='no-referrer';ttsAudio.style.display='none';document.body.appendChild(ttsAudio);
function providerUrls(text){const q=encodeURIComponent(text.replace(/\s+/g,' ').trim());return [`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-GB&q=${q}`,`https://translate.google.co.uk/translate_tts?ie=UTF-8&client=tw-ob&tl=en-GB&q=${q}`,`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en-GB&q=${q}`]}
function splitTTS(text,max=180){const c=text.replace(/\s+/g,' ').trim();if(c.length<=max)return[c];const out=[];let r=c;while(r.length){if(r.length<=max){out.push(r);break}let cut=r.lastIndexOf(' ',max);if(cut<max*.5)cut=max;out.push(r.slice(0,cut));r=r.slice(cut).trim()}return out}
function stopAudio(){playToken++;try{ttsAudio.pause();ttsAudio.removeAttribute('src');ttsAudio.load()}catch(e){}}
function playUrl(url,token){return new Promise((res,rej)=>{if(token!==playToken)return rej();let done=false;const finish=(ok)=>{if(done)return;done=true;ttsAudio.onended=ttsAudio.onerror=null;ok?res():rej()};ttsAudio.onended=()=>finish(true);ttsAudio.onerror=()=>finish(false);ttsAudio.src=url;ttsAudio.currentTime=0;const p=ttsAudio.play();if(p&&p.catch)p.catch(()=>finish(false))})}
async function playChunk(text,token){let e;for(const u of providerUrls(text)){try{await playUrl(u,token);return}catch(err){e=err}}throw e||new Error('audio')}
async function playSequence(texts,btn,idle='▶ Прослушать'){if(btn?.classList.contains('busy')){stopAudio();btn.classList.remove('busy');btn.textContent=idle;return}stopAudio();const token=++playToken;btn?.classList.add('busy');if(btn)btn.textContent='■ Стоп';try{for(const t of texts){if(token!==playToken)return;await playChunk(t,token)}if(token===playToken){btn?.classList.remove('busy');if(btn)btn.textContent=idle}}catch(e){if(token===playToken){btn?.classList.remove('busy');btn?.classList.add('error');if(btn)btn.textContent='Аудио недоступно';setTimeout(()=>{btn?.classList.remove('error');if(btn)btn.textContent=idle},2200)}}}
function playText(t,b,idle='▶ Прослушать'){return playSequence(splitTTS(t),b,idle)}
function playScript(lines,b,label='Диалог'){return playSequence(lines.flatMap(x=>splitTTS(x.text,120)),b,`▶ ${label}`)}

function genres(){const sec='genres',idx=state.idx[sec]||0,item=data.genres[idx],done=solved(sec,idx),opts=orderedOptions(sec,idx,item.o);const helpers=[{title:'Подсказка',html:listHint(['Смотри на ключевую идею: funny, scary, cowboys, future, serious story.','Можно нажать «Ключевая фраза» и услышать подсказку.'])}];app.innerHTML=shell(`${title(1,'Movie Genres','film vocabulary · cinema-card warm-up')}<div class="blockBody"><div class="visualCard">${visualWithHelpers(visualSlot('block1-genres.jpg','🎞️','MOVIE GENRES','Recognise different kinds of films','cinema posters and movie night'),helpers)}</div><div class="questionCard genreQuestion"><div class="kicker">Trailer clue</div><div class="prompt">${esc(item.clue)}</div><div class="subprompt">Прочитайте подсказку и выберите жанр. Верная карточка перевернётся и откроет мини-афишу с ключевой ассоциацией.</div><div class="posterOptions">${opts.map((o,i)=>posterCard(o,i,done&&o===item.a,done)).join('')}</div><div class="statusWrap"><div id="fb">${done?feedback('good','Верно! Жанр определён.'):feedback('neutral','Выберите жанр фильма')}</div>${miniProgress(sec,idx,data.genres.length)}</div></div></div><div class="footerActions"><div class="leftActions">${audioBtn('genreAudio','Ключевая фраза')}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>${idx===data.genres.length-1?'Следующий блок →':'Следующее задание →'}</button></div>`);document.getElementById('genreAudio').onclick=function(){playText(item.clue,this,'▶ Ключевая фраза')};document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{if(done)return;const ok=b.dataset.genre===item.a;recordAttempt(sec,idx,ok);if(ok){b.classList.add('revealed');document.querySelectorAll('[data-genre]').forEach(x=>x.disabled=true);document.getElementById('fb').innerHTML=feedback('good','Верно! Жанр определён.');document.getElementById('next').disabled=false;playText(item.a,null,'')}else{b.classList.add('wrongFlash');document.getElementById('fb').innerHTML=feedback('bad','Пока нет. Посмотрите на ключевые слова и попробуйте ещё раз.');setTimeout(()=>b.classList.remove('wrongFlash'),420)}});document.getElementById('next').onclick=()=>{if(idx<data.genres.length-1){state.idx[sec]=idx+1;save();render()}else{state.screen=2;save();render()}};bindGlobalUi()}

function director(){const sec='director',idx=state.idx[sec]||0,item=data.director[idx],done=solved(sec,idx),opts=orderedOptions(sec,idx,item.o);const helpers=[{title:'Мини-правило',html:listHint(['Imperative = глагол без подлежащего: Open the door.','Отрицательная команда: Don’t + verb: Don’t move.'])}];app.innerHTML=shell(`${title(2,'Director Says','imperatives · positive and negative commands')}<div class="blockBody"><div class="visualCard">${visualWithHelpers(visualSlot('block2-director.jpg','🎬','DIRECTOR SAYS','Follow clear instructions on a film set','director giving instructions on set'),helpers)}</div><div class="questionCard"><div class="kicker">Scene ${idx+1} · Take ${String(idx+1).padStart(2,'0')}</div><div class="prompt">${esc(item.scene)}</div><div class="subprompt">${esc(item.q)}</div><div class="answers">${opts.map(o=>`<button class="answer directorAnswer" data-val="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="statusWrap"><div id="fb">${done?feedback('good','Action! Команда выбрана верно.'):feedback('neutral','Выберите команду режиссёра')}</div>${miniProgress(sec,idx,data.director.length)}</div></div></div><div class="footerActions"><div class="leftActions"></div><button class="nextBtn" id="next" ${done?'':'disabled'}>${idx===data.director.length-1?'Следующий блок →':'Следующий дубль →'}</button></div>`);document.querySelectorAll('[data-val]').forEach(b=>b.onclick=()=>{if(done)return;const ok=b.dataset.val===item.a;recordAttempt(sec,idx,ok);if(ok){b.classList.add('correct');document.querySelectorAll('[data-val]').forEach(x=>x.disabled=true);document.getElementById('fb').innerHTML=feedback('good','Action! Команда выбрана верно.');document.getElementById('next').disabled=false;clapperFlash();playText(item.a,null,'')}else{b.classList.add('wrongFlash');document.getElementById('fb').innerHTML=feedback('bad','Не эта команда. Попробуйте ещё раз.');setTimeout(()=>b.classList.remove('wrongFlash'),420)}});document.getElementById('next').onclick=()=>{if(idx<data.director.length-1){state.idx[sec]=idx+1;save();render()}else{state.screen=3;save();render()}};bindGlobalUi()}

function pronouns(){const sec='pronouns',idx=state.idx[sec]||0,item=data.pronouns[idx],done=solved(sec,idx),opts=orderedOptions(sec,idx,item.o);const helpers=[{title:'Object pronouns',html:listHint(['I → me · he → him · she → her','it → it · we → us · they → them · you → you'])},{title:'Подсказка',html:`<p>${esc(item.hint)}</p>`}];app.innerHTML=shell(`${title(3,'Pronoun Close-up','object pronouns · me, him, her, it, us, them')}<div class="blockBody"><div class="visualCard">${visualWithHelpers(visualSlot('block3-pronouns.jpg','🎭','PRONOUN CLOSE-UP','Replace the noun with the right object pronoun','actors in a film scene'),helpers)}</div><div class="questionCard"><div class="kicker">Close-up</div><div class="prompt">${esc(item.s)}</div><div class="subprompt">Выберите object pronoun.</div><div class="pronounLens">${opts.map(o=>`<button class="lensBtn" data-pron="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="statusWrap"><div id="fb">${done?feedback('good','Верно!'):feedback('neutral','Выберите местоимение')}</div>${miniProgress(sec,idx,data.pronouns.length)}</div></div></div><div class="footerActions"><div class="leftActions">${audioBtn('pronAudio','Предложение')}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>${idx===data.pronouns.length-1?'Следующий блок →':'Следующее задание →'}</button></div>`);document.getElementById('pronAudio').onclick=function(){playText(item.s.replace('___',item.a),this,'▶ Предложение')};document.querySelectorAll('[data-pron]').forEach(b=>b.onclick=()=>{if(done)return;const ok=b.dataset.pron===item.a;recordAttempt(sec,idx,ok);if(ok){b.classList.add('lensCorrect');document.querySelectorAll('[data-pron]').forEach(x=>x.disabled=true);document.getElementById('fb').innerHTML=feedback('good','Верно!');document.getElementById('next').disabled=false;clapperFlash();playText(item.s.replace('___',item.a),null,'')}else{b.classList.add('wrongFlash');document.getElementById('fb').innerHTML=feedback('bad','Проверьте, кого или что заменяет местоимение.');setTimeout(()=>b.classList.remove('wrongFlash'),420)}});document.getElementById('next').onclick=()=>{if(idx<data.pronouns.length-1){state.idx[sec]=idx+1;save();render()}else{state.screen=4;save();render()}};bindGlobalUi()}

function builder(){const sec='builder',idx=state.idx[sec]||0,item=data.builder[idx],done=solved(sec,idx);if(!Array.isArray(state.builderChosen))state.builderChosen=[];const chosen=state.builderChosen;const shuffled=item.tokens.map((t,i)=>({t,i})).sort((a,b)=>((a.i*7+idx*3)%11)-((b.i*7+idx*3)%11));app.innerHTML=shell(`${title(4,'Sentence Builder','build the line · translation + audio model')}<div class="blockBody"><div class="visualCard">${visualWithHelpers(visualSlot('block4-builder.jpg','🧩','SCRIPT BUILDER','Build a director’s line in the correct order','script pages and clapperboard'),[{title:'Подсказка',html:listHint(['Команда обычно начинается с глагола: Look, Open, Listen, Show, Sit.','Don’t ставим перед глаголом в отрицательной команде.'])}])}</div><div class="questionCard"><div class="kicker">Scene line</div><div class="prompt">Build the sentence.</div><div class="builderWrap"><div class="builderCue">${esc(item.cue)}</div><div class="builderResult">${chosen.map((x,i)=>`<button class="token answerToken" data-remove="${i}">${esc(x.t)}</button>`).join('')||'<span class="builderPlaceholder">Нажимайте слова в правильном порядке.</span>'}</div><div class="tokenBank">${shuffled.map(x=>`<button class="token ${chosen.some(c=>c.i===x.i)?'used':''}" data-token="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="builderActions"><button class="smallBtn" id="clear">Сбросить</button><button class="smallBtn primary" id="check" ${done?'disabled':''}>Проверить</button></div></div><div class="statusWrap"><div id="fb">${done?feedback('good','Отлично! Реплика собрана.'):feedback('neutral','Соберите предложение')}</div>${miniProgress(sec,idx,data.builder.length)}</div></div></div><div class="footerActions"><div class="leftActions">${audioBtn('model','Модель')}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>${idx===data.builder.length-1?'Следующий блок →':'Следующая реплика →'}</button></div>`);document.getElementById('model').onclick=function(){playText(item.audio,this,'▶ Модель')};document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{const i=+b.dataset.token;if(!chosen.some(c=>c.i===i)){chosen.push({i,t:item.tokens[i]});state.builderChosen=chosen;save();builder()}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{chosen.splice(+b.dataset.remove,1);save();builder()});document.getElementById('clear').onclick=()=>{state.builderChosen=[];save();builder()};document.getElementById('check').onclick=()=>{const text=chosen.map(x=>x.t).join(' '),target=item.tokens.join(' '),ok=text===target;recordAttempt(sec,idx,ok);if(ok){document.getElementById('fb').innerHTML=feedback('good','Отлично! Реплика собрана.');document.getElementById('next').disabled=false;document.querySelectorAll('.token').forEach(x=>x.disabled=true);clapperFlash();playText(item.audio,null,'')}else{document.getElementById('fb').innerHTML=feedback('bad','Порядок пока неверный. Попробуйте ещё раз.')}};document.getElementById('next').onclick=()=>{state.builderChosen=[];if(idx<data.builder.length-1){state.idx[sec]=idx+1;save();render()}else{state.screen=5;save();render()}};bindGlobalUi()}

function reading(){const sec='reading',idx=state.idx[sec]||0,item=data.reading.qs[idx],done=solved(sec,idx),opts=orderedOptions(sec,idx,item.o);const transcript=data.reading.lines.map(x=>x);const readText=data.reading.lines.map(x=>`<p><b>${esc(x.speaker)}:</b> ${esc(x.text)}</p>`).join('');app.innerHTML=shell(`${title(5,'Script Reading','read a short film-set scene and find the details')}<div class="blockBody"><div class="visualCard"><div class="readingCardStack"><div class="readingVisual portrait filmScriptLayout"><div class="readingArtFrame">${visualSlot('block5-reading.jpg','📖','SCRIPT READING','Read a short scene on a film set','film set reading visual')}</div><div class="readText screenplay">${readText}</div></div>${helperDock([{title:'Подсказка',html:listHint(['Ищите точные команды: stand, sit, look, don’t move.','Имена помогают понять, к кому относится команда.'])}])}</div></div><div class="questionCard"><div class="kicker">Script check</div><div class="prompt">${esc(item.q)}</div><div class="subprompt">Ответьте по тексту. Можно перечитать или прослушать сцену.</div><div class="answers">${opts.map(o=>`<button class="answer" data-read="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="statusWrap"><div id="fb">${done?feedback('good','Верно!'):feedback('neutral','Найдите ответ в тексте')}</div>${miniProgress(sec,idx,data.reading.qs.length)}</div></div></div><div class="footerActions"><div class="leftActions">${audioBtn('readAudio','Сцену')}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>${idx===data.reading.qs.length-1?'Следующий блок →':'Следующее задание →'}</button></div>`);document.getElementById('readAudio').onclick=function(){playScript(transcript,this,'Сцену')};document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{if(done)return;const ok=b.dataset.read===item.a;recordAttempt(sec,idx,ok);if(ok){b.classList.add('correct');document.querySelectorAll('[data-read]').forEach(x=>x.disabled=true);document.getElementById('fb').innerHTML=feedback('good','Верно!');document.getElementById('next').disabled=false}else{b.classList.add('wrongFlash');document.getElementById('fb').innerHTML=feedback('bad','Проверьте текст ещё раз.');setTimeout(()=>b.classList.remove('wrongFlash'),420)}});document.getElementById('next').onclick=()=>{if(idx<data.reading.qs.length-1){state.idx[sec]=idx+1;save();render()}else{state.screen=6;save();render()}};bindGlobalUi()}

function rhythm(){const sec='rhythm',idx=state.idx[sec]||0,item=data.rhythm[idx],done=solved(sec,idx);if(!Array.isArray(state.rhythmSelected))state.rhythmSelected=[];const selected=state.rhythmSelected;app.innerHTML=shell(`${title(6,'Rhythm Take','sentence rhythm · tap the strong words')}<div class="blockBody"><div class="visualCard">${visualWithHelpers(visualSlot('block6-rhythm.jpg','🎧','RHYTHM TAKE','Feel the rhythm of short film-set lines','headphones and clapperboard in studio'),[{title:'Подсказка',html:listHint(['Сильнее звучат ключевые слова: глагол, важное существительное или местоимение.','Служебные слова часто звучат слабее: at, the, to.'])}])}</div><div class="questionCard"><div class="kicker">Sound stage · Take ${idx+1}</div><div class="prompt">Tap the strong words.</div><div class="subprompt">Выберите слова, на которые падает основное ударение.</div><div class="rhythmStrip">${item.choices.map((w,i)=>`<button class="rhythmWord ${selected.includes(i)?'selected':''}" data-rhythm="${i}" ${done?'disabled':''}>${esc(w)}</button>`).join('')}</div><div class="beatLine">${item.choices.map((w,i)=>`<i class="beat ${selected.includes(i)?'on':''}"></i>`).join('')}</div><button class="smallBtn primary rhythmCheck" id="check" ${done?'disabled':''}>Проверить ритм</button><div class="statusWrap"><div id="fb">${done?feedback('good','Отлично! Ритм найден.'):feedback('neutral','Выберите сильные слова')}</div>${miniProgress(sec,idx,data.rhythm.length)}</div></div></div><div class="footerActions"><div class="leftActions">${audioBtn('rhythmAudio','Фразу')}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>${idx===data.rhythm.length-1?'Следующий блок →':'Следующий дубль →'}</button></div>`);document.getElementById('rhythmAudio').onclick=function(){playText(item.s.replace(/[A-Z]{2,}/g,m=>m.toLowerCase()),this,'▶ Фразу')};document.querySelectorAll('[data-rhythm]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rhythm;state.rhythmSelected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];save();rhythm()});document.getElementById('check').onclick=()=>{const chosen=item.choices.filter((_,i)=>selected.includes(i)),ok=chosen.length===item.stress.length&&item.stress.every(x=>chosen.includes(x));recordAttempt(sec,idx,ok);if(ok){document.getElementById('fb').innerHTML=feedback('good','Отлично! Ритм найден.');document.getElementById('next').disabled=false;clapperFlash();playText(item.s.toLowerCase(),null,'')}else{document.getElementById('fb').innerHTML=feedback('bad','Почти. Оставьте ударение на ключевых словах.')}};document.getElementById('next').onclick=()=>{state.rhythmSelected=[];if(idx<data.rhythm.length-1){state.idx[sec]=idx+1;save();render()}else{state.screen=7;save();render()}};bindGlobalUi()}

function studio(){const sec='studio',idx=state.idx[sec]||0,item=data.studio.qs[idx],done=solved(sec,idx),opts=orderedOptions(sec,idx,item.o),script=data.studio.scripts.find(s=>s.id===item.script);const helpers=[{title:'Открыть текст диалога',html:transcriptHtml(script.lines)},{title:'Лёгкая подсказка',html:listHint(['Сначала определите, кто или что было названо перед pronoun.','him = мужчина, her = женщина, it = предмет/один фильм, them = несколько людей/фильмов.'])}];app.innerHTML=shell(`${title(7,'Studio Talk','short dialogue · pronoun reference')}<div class="blockBody"><div class="visualCard">${visualWithHelpers(visualSlot('block7-studio.jpg','🎤','STUDIO TALK','Listen to a short film conversation','two people discussing films'),helpers)}</div><div class="questionCard"><div class="kicker">${esc(script.title)}</div><div class="prompt">${esc(item.q)}</div><div class="subprompt">Прослушайте диалог. Если трудно, откройте текст под изображением.</div><div class="answers">${opts.map(o=>`<button class="answer" data-studio="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="statusWrap"><div id="fb">${done?feedback('good','Верно!'):feedback('neutral','Сначала прослушайте диалог')}</div>${miniProgress(sec,idx,data.studio.qs.length)}</div></div></div><div class="footerActions"><div class="leftActions">${audioBtn('studioAudio',`Диалог ${script.id}`)}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>${idx===data.studio.qs.length-1?'Следующий блок →':'Следующее задание →'}</button></div>`);document.getElementById('studioAudio').onclick=function(){playScript(script.lines,this,`Диалог ${script.id}`)};document.querySelectorAll('[data-studio]').forEach(b=>b.onclick=()=>{if(done)return;const ok=b.dataset.studio===item.a;recordAttempt(sec,idx,ok);if(ok){b.classList.add('correct');document.querySelectorAll('[data-studio]').forEach(x=>x.disabled=true);document.getElementById('fb').innerHTML=feedback('good','Верно!');document.getElementById('next').disabled=false}else{b.classList.add('wrongFlash');document.getElementById('fb').innerHTML=feedback('bad','Проверьте, к кому или к чему относится pronoun.');setTimeout(()=>b.classList.remove('wrongFlash'),420)}});document.getElementById('next').onclick=()=>{if(idx<data.studio.qs.length-1){state.idx[sec]=idx+1;save();render()}else{state.screen=8;save();render()}};bindGlobalUi()}

function actionChallenge(){const sec='action',idx=state.idx[sec]||0,item=data.action[idx],done=solved(sec,idx);const targets=[['mia','Mia','🎭'],['leo','Leo','🎬'],['director','Director','🎥'],['camera','Camera','📹'],['door','Door','🚪'],['group','The actors','👥']];app.innerHTML=shell(`${title(8,'Action Challenge','signature block · react to the director on set')}<div class="blockBody"><div class="visualCard">${visualWithHelpers(visualSlot('block8-action.jpg','🎥','ACTION CHALLENGE','React to the director on a live film set','cinematic film set with cast and camera'),[{title:'Как играть?',html:listHint(['Прослушайте команду режиссёра.','Нажмите на человека или предмет, к которому относится object pronoun.','Верный выбор «снимает» новый кадр плёнки.'])}])}</div><div class="questionCard actionCard"><div class="kicker">LIVE SET · FRAME ${String(idx+1).padStart(2,'0')}</div><div class="prompt">Who or what does the director mean?</div><div class="directorCue"><span>🎬 DIRECTOR</span><strong>${esc(item.instruction)}</strong></div><div class="setStage">${targets.map(([id,label,icon])=>`<button class="setTarget ${done&&id===item.target?'captured':''}" data-target="${id}" ${done?'disabled':''}><span>${icon}</span><b>${esc(label)}</b></button>`).join('')}</div><div class="filmStripMini">${Array.from({length:data.action.length},(_,i)=>`<i class="frameDot ${i<idx?'shot':i===idx?'live':''}">${i+1}</i>`).join('')}</div><div class="statusWrap"><div id="fb">${done?feedback('good','Cut! Кадр снят правильно.'):feedback('neutral','Прослушайте команду и выберите цель')}</div>${miniProgress(sec,idx,data.action.length)}</div></div></div><div class="footerActions"><div class="leftActions">${audioBtn('actionAudio','Команду')}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>${idx===data.action.length-1?'Результаты →':'Следующий кадр →'}</button></div>`);document.getElementById('actionAudio').onclick=function(){playText(item.instruction,this,'▶ Команду')};document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{if(done)return;const ok=b.dataset.target===item.target;recordAttempt(sec,idx,ok);if(ok){b.classList.add('captured');document.querySelectorAll('[data-target]').forEach(x=>x.disabled=true);document.getElementById('fb').innerHTML=feedback('good','Cut! Кадр снят правильно.');document.getElementById('next').disabled=false;playText(item.instruction,null,'')}else{b.classList.add('wrongFlash');document.getElementById('fb').innerHTML=feedback('bad','Не эта цель. Подумайте, кого или что заменяет pronoun.');setTimeout(()=>b.classList.remove('wrongFlash'),420)}});document.getElementById('next').onclick=()=>{if(idx<data.action.length-1){state.idx[sec]=idx+1;save();render()}else{state.screen=9;save();render()}};bindGlobalUi()}

function results(){const totalMax=SECTIONS.reduce((n,k)=>n+MAX[k],0),total=SECTIONS.reduce((n,k)=>n+score(k),0),pct=Math.round(total/totalMax*100),sorted=[...SECTIONS].sort((a,b)=>score(b)/MAX[b]-score(a)/MAX[a]),best=sorted[0],weak=sorted.at(-1);app.innerHTML=shell(`<div class="titlebar"><div class="titlewrap"><h1>Your <span class="n">Results</span></h1><p>Beginner · Unit 7B · Lights, camera, action!</p></div><div class="progressBox"><strong>Готово</strong><div class="track"><i style="width:100%"></i></div></div></div><div class="results filmResults"><div class="ring" style="--pct:${pct}"><strong>${pct}%</strong><span>с первого раза</span></div><div><div class="resultList">${SECTIONS.map(k=>{const p=Math.round(score(k)/MAX[k]*100);return `<div class="resrow"><label>${LABELS[k]}</label><div class="resbar"><i style="width:${p}%"></i></div><b>${score(k)}/${MAX[k]}</b></div>`}).join('')}</div><div class="coach"><div><strong>Лучший дубль</strong><p>${LABELS[best]} — самый сильный результат.</p></div><div><strong>Ещё один дубль</strong><p>${LABELS[weak]} — этот блок полезно пройти ещё раз.</p></div></div><div class="coach" style="margin-top:14px"><div><strong>Вы потренировали</strong><p>Film genres, imperatives, object pronouns, reading, listening и sentence rhythm.</p></div><div><strong>Финальный кадр</strong><p>Попробуйте произнести 3–4 команды режиссёра вслух без подсказки.</p></div></div><div class="heroBtns" style="margin-top:16px"><button class="btn primary" id="retry">Пройти ещё раз</button><button class="btn secondary" id="home">На главную</button></div></div></div>`);document.getElementById('retry').onclick=()=>{state=fresh();state.screen=1;save();render()};document.getElementById('home').onclick=()=>{state.screen=0;save();render()};bindGlobalUi()}

function render(){stopAudio();({0:start,1:genres,2:director,3:pronouns,4:builder,5:reading,6:rhythm,7:studio,8:actionChallenge,9:results}[state.screen]||start)()}
render();

</script>
