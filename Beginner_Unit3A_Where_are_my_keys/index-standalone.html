<script>
(() => {
  const PIN = String(window.WOW_MODULE_PIN ?? '').trim();
  if (!PIN) return;

  const IS_EMBEDDED = window.self !== window.top;
  const SESSION_KEY = 'wow_module_pin_access:' + location.pathname;

  // In a normal browser tab, remember successful access for the current tab session.
  // Inside Holst (iframe), always show the PIN screen whenever the module document opens.
  if (!IS_EMBEDDED) {
    try {
      if (sessionStorage.getItem(SESSION_KEY) === PIN) return;

  const style = document.createElement('style');

    .wow-pin-gate{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,rgba(221,237,255,.98),rgba(248,241,255,.98) 52%,rgba(255,247,226,.98));font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#10275f}

    .wow-pin-card{position:relative;width:min(92vw,500px);padding:38px 38px 34px;border-radius:32px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.98);box-shadow:0 28px 70px rgba(43,75,145,.20),inset 0 2px 0 #fff;text-align:center}
    .wow-pin-logo{font-size:32px;line-height:1;font-weight:1000;letter-spacing:-1.2px;color:#10275f}.wow-pin-logo span{color:#2d8df7}
    .wow-pin-meta{margin-top:8px;font-size:14px;font-weight:800;color:#7283a5}

    .wow-pin-sub{margin:0 0 22px;font-size:15px;line-height:1.45;font-weight:700;color:#687a9f}

    .wow-pin-btn{width:100%;height:58px;margin-top:14px;border:0;border-radius:18px;background:linear-gradient(145deg,#20c7c1,#2d8df7);color:#fff;font:inherit;font-size:18px;font-weight:950;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 12px 24px rgba(36,145,214,.20);transition:.15s}

    .wow-pin-gate.wrong .wow-pin-card{animation:wowPinShake .26s linear}.wow-pin-gate.success{animation:wowPinFade .22s ease forwards}

    @keyframes wowPinFade{to{opacity:0;visibility:hidden}}
  `;
  document.head.appendChild(style);

  const gate = document.createElement('div');
  gate.className = 'wow-pin-gate';
  gate.setAttribute('role','dialog');
  gate.setAttribute('aria-modal','true');
  gate.setAttribute('aria-label','Вход в учебный модуль');
  gate.innerHTML = `
    <div class="wow-pin-card">
      <div class="wow-pin-logo"><span>WOW</span> SCHOOL</div>
      <div class="wow-pin-meta">online english school · wow-school.ru</div>
      <div class="wow-pin-title">Введите PIN-код</div>
      <p class="wow-pin-sub">Введите код доступа, чтобы открыть учебный модуль.</p>
      <form id="wowPinForm" autocomplete="off">
        <input id="wowPinInput" class="wow-pin-input" type="password" inputmode="numeric" autocomplete="one-time-code" aria-label="PIN-код" />
        <button class="wow-pin-btn" type="submit">Войти</button>
        <div id="wowPinError" class="wow-pin-error" aria-live="polite"></div>
      </form>
    </div>`;
  document.body.appendChild(gate);

  const form = gate.querySelector('#wowPinForm');
  const input = gate.querySelector('#wowPinInput');
  const error = gate.querySelector('#wowPinError');

  const unlock = () => {
    if (!IS_EMBEDDED) {
      try { sessionStorage.setItem(SESSION_KEY, PIN); } catch (_) {}
    }
    gate.classList.add('success');
    setTimeout(() => gate.remove(), 230);
  };

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value === PIN) {
      error.textContent = '';
      unlock();
      return;
    }
    error.textContent = 'Неверный PIN-код. Попробуйте ещё раз.';
    gate.classList.remove('wrong');
    void gate.offsetWidth;
    gate.classList.add('wrong');
    input.select();
  });

  setTimeout(() => input.focus(), 50);
})();

</script>

function splitTTS(text,max=115){const clean=text.replace(/\s+/g,' ').trim();if(clean.length<=max)return [clean];const out=[];let rest=clean;while(rest.length){if(rest.length<=max){out.push(rest);break}let cut=rest.lastIndexOf(' ',max);if(cut<50)cut=max;out.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trim()}return out.filter(Boolean)}

function playUrl(url,token){return new Promise((resolve,reject)=>{if(token!==playToken)return reject(new Error('cancelled'));const a=ttsAudio;currentAudio=a;let done=false;const clean=()=>{a.onended=a.onerror=a.onabort=null;clearTimeout(timer)};const timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('timeout'))},22000);a.onended=()=>{if(done)return;done=true;clean();resolve()};a.onerror=()=>{if(done)return;done=true;clean();reject(new Error('audio'))};a.onabort=()=>{if(done)return;done=true;clean();reject(new Error('aborted'))};a.src=url;a.currentTime=0;a.load();const p=a.play();if(p&&p.catch)p.catch(e=>{if(done)return;done=true;clean();reject(e)})})}
async function playChunk(text,token){let last;for(const url of providerUrls(text)){if(token!==playToken)throw new Error('cancelled');try{await playUrl(url,token);return}catch(e){last=e}}throw last||new Error('audio')}
async function playSequence(texts,btn,idle='▶ Прослушать'){stopAudio();const token=++playToken;btn?.classList.add('busy');if(btn)btn.textContent='■ Стоп';try{for(const raw of texts){for(const c of splitTTS(raw)){if(token!==playToken)return;await playChunk(c,token)}}if(token===playToken){btn?.classList.remove('busy');btn.textContent=idle}}catch(e){if(token===playToken){btn?.classList.remove('busy');btn?.classList.add('error');btn.textContent='Аудио недоступно';setTimeout(()=>{btn?.classList.remove('error');btn.textContent=idle},2200)}}}
function playText(t,b){return playSequence([t],b,'▶ Прослушать')}
function playScript(lines,b){return playSequence(lines.map(x=>x.text),b,'▶ Прослушать')}

;this.classList.remove('busy');this.textContent='▶ Послушать текст'}else playSequence(data.reading.audioChunks,this,'▶ Послушать текст')};document.getElementById('next').onclick=()=>{if(i<data.reading.qs.length-1){state.idx[s]=i+1;save();render()}else{state.screen=6;save();render()}}}
function memory(){if(!Array.isArray(state.memoryOrder)||state.memoryOrder.length!==data.memory.length*2){state.memoryOrder=shuffle(data.memory.flatMap((p,i)=>[{pair:i,text:p.a},{pair:i,text:p.b}]));state.memoryOpen=[];state.memoryMoves=0;save()}const all=data.memory.every((_,i)=>state.answers.memory[i]?.solved);app.innerHTML=shell(`${title(6,'Memory Match','Match singular and plural forms')}<div class="memoryWrap">${state.memoryOrder.map((c,idx)=>{const matched=state.answers.memory[c.pair]?.solved,open=state.memoryOpen.includes(idx);return `<button class="memoryCard ${matched?'matched':open?'open':'covered'}" data-mem="${idx}" ${matched?'disabled':''}>${esc(c.text)}</button>`}).join('')}</div><div class="memoryMeta"><span>Найдено пар: ${Object.values(state.answers.memory||{}).filter(x=>x.solved).length}/${data.memory.length}</span><span>Ходов: ${state.memoryMoves||0}</span></div><div class="footerActions"><div class="leftActions"><button class="ghostBtn" id="reshuffle">Перемешать</button></div><button class="nextBtn" id="next" ${all?'':'disabled'}>Следующий блок →</button></div>`);document.querySelectorAll('[data-mem]').forEach(b=>b.onclick=()=>{const idx=+b.dataset.mem;if(state.memoryOpen.includes(idx)||state.memoryOpen.length>=2)return;state.memoryOpen.push(idx);save();render();if(state.memoryOpen.length===2){const [a,bidx]=state.memoryOpen;const ca=state.memoryOrder[a],cb=state.memoryOrder[bidx];state.memoryMoves=(state.memoryMoves||0)+1;if(ca.pair===cb.pair){state.answers.memory[ca.pair]={solved:true,firstCorrect:true};state.memoryOpen=[];save();setTimeout(render,250)}else{save();setTimeout(()=>{state.memoryOpen=[];save();render()},650)}}});document.getElementById('reshuffle').onclick=()=>{state.memoryOrder=shuffle(data.memory.flatMap((p,i)=>[{pair:i,text:p.a},{pair:i,text:p.b}]));state.memoryOpen=[];state.answers.memory={};state.memoryMoves=0;save();render()};document.getElementById('next').onclick=()=>{state.screen=7;save();render()}}
function listening(){const s='listening',i=state.idx[s]||0,x=data.listening.qs[i],done=solved(s,i),script=data.listening.scripts.find(d=>d.id===x.script),opts=orderedOptions(s,i,x.o);app.innerHTML=shell(`${title(7,'Listening Mission','Two short dialogues · objects people look for')}<div class="blockBody"><div class="visualCard">${visualListening()}</div><div class="questionCard"><div class="kicker">Dialogue ${script.id}</div><div class="prompt">${esc(x.q)}</div><div class="subprompt">Можно слушать несколько раз. Реплики озвучиваются короткими фрагментами.</div><div class="answers">${opts.map(o=>`<button class="answer" data-value="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="statusWrap"><div id="fb">${done?feedback('good','Верно!'):feedback('neutral','Сначала прослушай диалог')}</div>${miniProgress(s,i,data.listening.qs.length)}</div></div></div><div class="footerActions"><div class="leftActions">${audioBtn('listenAudio',`Диалог ${script.id}`)}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>${i===data.listening.qs.length-1?'Результат →':'Следующее задание →'}</button></div>`);document.getElementById('listenAudio').onclick=function(){if(this.classList.contains('busy')){stopAudio();this.classList.remove('busy');this.textContent=`▶ Диалог ${script.id}`}else playScript(script.lines,this)};document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{if(solved(s,i))return;const ok=b.dataset.value===x.a;recordAttempt(s,i,ok);if(ok){b.classList.add('correct');document.getElementById('fb').innerHTML=feedback('good','Верно!');document.querySelectorAll('[data-value]').forEach(y=>y.disabled=true);document.getElementById('next').disabled=false}else{b.classList.add('wrongFlash');document.getElementById('fb').innerHTML=feedback('bad','Пока нет. Прослушай ещё раз.');setTimeout(()=>b.classList.remove('wrongFlash'),500)}});document.getElementById('next').onclick=()=>{if(i<data.listening.qs.length-1){state.idx[s]=i+1;save();render()}else{state.screen=8;save();render()}}}
function results(){const keys=SECTIONS,totalMax=keys.reduce((n,k)=>n+MAX[k],0),total=keys.reduce((n,k)=>n+score(k),0),pct=Math.round(total/totalMax*100),sorted=[...keys].sort((a,b)=>score(b)/MAX[b]-score(a)/MAX[a]),best=sorted[0],weak=sorted.at(-1);app.innerHTML=shell(`<div class="titlebar"><div class="titlewrap"><h1>Your <span class="n">Results</span></h1><p>Beginner · Unit 3A · Where are my keys?</p></div><div class="progressBox"><strong>Готово</strong><div class="track"><i style="width:100%"></i></div></div></div><div class="results"><div class="ring" style="--pct:${pct}"><strong>${pct}%</strong><span>общий результат</span></div><div><div class="resultList">${keys.map(k=>{const p=Math.round(score(k)/MAX[k]*100);return `<div class="resrow"><label>${LABELS[k]}</label><div class="resbar"><i style="width:${p}%"></i></div><b>${score(k)}/${MAX[k]}</b></div>`}).join('')}</div><div class="coach"><div><strong>Сильнее всего</strong><p>${LABELS[best]} — здесь результат выше всего.</p></div><div><strong>Что повторить</strong><p>${LABELS[weak]} — этот блок стоит пройти ещё раз.</p></div></div><div class="heroBtns" style="margin-top:16px"><button class="btn primary" id="retry">Пройти ещё раз</button><button class="btn secondary" id="home">На главную</button></div></div></div>`);document.getElementById('retry').onclick=()=>{state=fresh();state.screen=1;save();render()};document.getElementById('home').onclick=()=>{state.screen=0;save();render()}}

<script>
/* WOW SCHOOL v4 retrofit layer. Educational app logic remains in the original app.js. */
const WOW_V4_HELPERS={
  1:{title:"Лёгкая подсказка",html:"Смотри на предмет и сначала назови его по-английски про себя. Затем сравни варианты."},
  2:{title:"Простое правило",html:"Один предмет: <b>a / an + singular</b>. Несколько предметов: plural form. В вопросе проверь <b>What is it? / What are they?</b>."},
  3:{title:"Лёгкая подсказка",html:"Слушай конец plural form: /s/, /z/ или /ɪz/. Ориентируйся на звук, а не только на написание."},
  4:{title:"Лёгкая подсказка",html:"В вопросах о вещах сначала реши: один предмет или несколько. Это подскажет <b>is / are</b> и <b>it / they</b>."}
};
const WOW_V4_TRANSCRIPT={"screen": 7, "section": "listening", "kind": "scripts", "roles": []};
function wowV4Esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function wowV4HelperDetails(title,html){return `<details class="helperDetails"><summary>${wowV4Esc(title)}</summary><div class="helperBody">${html}</div></details>`}
function wowV4NormalizeLine(line,i,roles){
 let speaker='',text='';
 if(typeof line==='string'){
   const m=line.match(/^([^:]+):\s*(.*)$/);
   if(m&&m[1].length<=32){speaker=m[1].trim();text=m[2].trim()}else text=line;
 }else if(line&&typeof line==='object'){
   speaker=line.speaker||line.voice||line.name||'';text=line.text||line.line||'';
 }
 if(!speaker)speaker=(roles&&roles.length?roles[i%roles.length]:`Speaker ${i%2+1}`);
 return {speaker,text};
}
function wowV4TranscriptLines(){
 const c=WOW_V4_TRANSCRIPT;if(!c)return [];
 try{
   const sec=c.section,src=data[sec],roles=c.roles||[];
   let lines=[];
   if(c.kind==='scripts'){
     const idx=(state.idx&&state.idx[sec])||0,item=src.qs[idx],sid=item&&item.script;
     const script=src.scripts.find(s=>s.id===sid)||src.scripts[0];lines=script?.lines||[];
   }else if(c.kind==='lines')lines=src.lines||[];
   else if(c.kind==='transcript')lines=src.transcript||[];
   else if(c.kind==='array-script'){
     const idx=(state.idx&&state.idx[sec])||0;lines=src[idx]?.script||[];
   }else if(c.kind==='array-lines'){
     const idx=(state.idx&&state.idx[sec])||0;lines=src[idx]?.lines||[];
   }
   return lines.map((x,i)=>wowV4NormalizeLine(x,i,roles)).filter(x=>x.text);
 }catch(_){return []}
}
function wowV4TranscriptHTML(){
 const lines=wowV4TranscriptLines();if(!lines.length)return '';
 return `<div class="transcript">${lines.map(x=>`<div class="transcriptLine"><strong>${wowV4Esc(x.speaker)}</strong><span>${wowV4Esc(x.text)}</span></div>`).join('')}</div>`;
}
function wowV4ApplyHelpers(){
 const screen=state?.screen||0;
 const details=[];
 const h=WOW_V4_HELPERS[screen];if(h)details.push(wowV4HelperDetails(h.title,h.html));
 if(WOW_V4_TRANSCRIPT&&screen===WOW_V4_TRANSCRIPT.screen){
   const t=wowV4TranscriptHTML();if(t)details.push(wowV4HelperDetails('Открыть текст диалога',t));
 }
 if(!details.length)return;
 const body=document.querySelector('.blockBody');
 const visual=body&&Array.from(body.children).find(el=>el.classList?.contains('visualCard'));
 if(body&&visual){
   const column=document.createElement('div');column.className='visualColumn';
   body.insertBefore(column,visual);column.appendChild(visual);
   const wrap=document.createElement('div');wrap.className='visualHelpers';wrap.innerHTML=details.join('');column.appendChild(wrap);return;
 }
 const left=document.querySelector('.layout .leftPanel');
 if(left){
   const wrap=document.createElement('div');wrap.className='visualHelpers';wrap.innerHTML=details.join('');
   const footer=left.querySelector('.footerActions');if(footer)left.insertBefore(wrap,footer);else left.appendChild(wrap);
 }
}
if(typeof render==='function'){
 const wowV4BaseRender=render;
 render=function(){wowV4BaseRender();wowV4ApplyHelpers()};
 wowV4ApplyHelpers();
}

function wowV4Sections(){
  try{if(typeof SECTIONS!=='undefined'&&Array.isArray(SECTIONS))return SECTIONS}catch(_){}
  try{if(typeof ORDER!=='undefined'&&Array.isArray(ORDER))return ORDER}catch(_){}
  return [];
}
function wowV4QaChangeTask(delta){
  const sections=wowV4Sections(),sec=sections[(state.screen||0)-1];
  if(!sec||!state.idx||!(sec in state.idx))return;
  let total=0;try{total=MAX[sec]||0}catch(_){}
  if(!total)return;
  const cur=state.idx[sec]||0,next=Math.max(0,Math.min(total-1,cur+delta));
  if(next===cur)return;
  state.idx[sec]=next;
  if('builderChosen' in state)state.builderChosen=[];
  if('selectedSort' in state)state.selectedSort=null;
  if(typeof save==='function')save();
  if(typeof render==='function')render();
}
function wowV4QaChangeBlock(delta){
  const sections=wowV4Sections(),last=sections.length;if(!last)return;
  const current=state.screen>=1&&state.screen<=last?state.screen:(delta>0?0:last+1);
  const next=Math.max(1,Math.min(last,current+delta));if(next===state.screen)return;
  state.screen=next;
  if('builderChosen' in state)state.builderChosen=[];
  if('selectedSort' in state)state.selectedSort=null;
  if(typeof save==='function')save();
  if(typeof render==='function')render();
}
addEventListener('keydown',e=>{
  if(document.querySelector('.wow-pin-gate'))return;
  if(e.altKey&&e.shiftKey&&!e.ctrlKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();wowV4QaChangeTask(e.key==='ArrowRight'?1:-1);return}
  if(e.altKey&&e.ctrlKey&&!e.shiftKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();wowV4QaChangeBlock(e.key==='ArrowRight'?1:-1)}
});


</script>
