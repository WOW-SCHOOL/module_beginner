  `;

  gate.setAttribute('aria-modal','true');
  gate.setAttribute('aria-label','Вход в учебный модуль');
  gate.innerHTML = `

    void gate.offsetWidth;
    gate.classList.add('wrong');
    input.select();
  });

  setTimeout(() => input.focus(), 50);
})();

function simpleQuiz(sec,screenNo,titleTxt,sub,leftHTML,audioParts=null,nextScreen=null){const idx=state.idx[sec], item=(sec==='menu'?data.menuQs[idx]:sec==='rob'?data.rob.qs[idx]:sec==='jenny'?data.jenny.qs[idx]:sec==='phrases'?data.phrases[idx]:data.prices[idx]);const total=MAX[sec];app.innerHTML=shell(`${title(screenNo,titleTxt,sub)}<div class="layout"><div class="leftPanel">${leftHTML}<div class="footerActions"><div class="leftActions">${audioParts?audioBtn(sec+'Audio','Прослушать'):''}</div></div></div><div class="rightPanel">${rightTop(sec,screenNo)}<div class="kmini">${titleTxt}</div><div class="questionTitle">${esc(item.q)}</div><div class="instruction">Выбери один правильный вариант. После ошибки можно попробовать ещё раз.</div><div class="options">${item.o.map((x,i)=>{const ans=state.answers[sec][idx];let cls='option';if(ans&&ans.chosen===i&&ans.lastCorrect)cls+=' good';else if(ans&&ans.chosen===i&&!ans.lastCorrect)cls+=' bad';return `<button class="${cls}" data-opt="${i}">${esc(x)}</button>`}).join('')}</div>${feedbackFor(sec,idx)}${footerProgress(sec,idx,total)}<div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="nextBtn" id="next" ${state.answers[sec][idx]?.firstCorrect? '':'disabled'}>${idx===total-1?'Следующий блок →':'Следующее задание →'}</button></div></div></div>`);document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const chosen=+b.dataset.opt;let a=state.answers[sec][idx]||{attempts:0,firstCorrect:null,lastCorrect:false,chosen:null};a.attempts++;a.chosen=chosen;a.lastCorrect=chosen===item.a;if(a.firstCorrect===null&&a.lastCorrect)a.firstCorrect=true;state.answers[sec][idx]=a;save();render()});if(audioParts){document.getElementById(sec+'Audio').onclick=function(){if(this.classList.contains('busy')){stopAudio();this.classList.remove('busy');this.textContent='▶ Прослушать'}else speak(audioParts,this,'Прослушать')}}document.getElementById('next').onclick=()=>{if(idx<total-1){state.idx[sec]++;save();render()}else{state.screen=nextScreen;save();render()}}}

function prices(){const left=`<div class="mediaTextRow"><div class="sceneImageCard compactPhoto"><img src="assets/images/block1-prices.png" alt="Café prices and money"></div><div class="visualGrid stackedCards"><div class="currencyCard"><h4>£ Pounds</h4><ul><li>£6.75 → six pounds seventy-five</li><li>£1.50 → one pound fifty</li><li>60p → sixty pence</li></ul></div><div class="currencyCard"><h4>€ Euros / $ Dollars</h4><ul><li>€15.99 → fifteen euros ninety-nine</li><li>$9.70 → nine dollars seventy cents</li><li>$0.80 → eighty cents</li></ul></div></div></div><div class="priceBoard"><h4>Mini guide</h4><div class="smallMuted">In British English we usually do <b>not</b> say “and” in prices like £6.75 or €3.20.</div><div class="priceList"><div class="priceRow"><span>£12.75</span><span>twelve pounds seventy-five</span></div><div class="priceRow"><span>€3.20</span><span>three euros twenty</span></div><div class="priceRow"><span>$9.49</span><span>nine dollars forty-nine</span></div></div></div>`;simpleQuiz('prices',1,'Understanding Prices','prices in pounds, euros, and dollars',left,['twelve pounds seventy-five','fifteen euros ninety-nine','three euros twenty','eighty cents','six pounds seventy-five'],2)}

function sounds(){const bins=[['/ʊə/','/ʊə/','euro · Europe · European'],['/s/','/s/','centre · city · cents'],['/k/','/k/','coffee · Coke · card']];if(!Array.isArray(state.sortOrder)||state.sortOrder.length!==data.sounds.length){state.sortOrder=shuffledIndicesForSort(data.sounds);save()}const order=state.sortOrder,done=data.sounds.every((_,i)=>state.answers.sounds[i]?.solved);app.innerHTML=shell(`${title(2,'Pronunciation Lab','/ʊə/, /s/, and /k/')}<div class="sortLayout"><div class="pronunciationIntro"><div class="pronunciationIcon">🔊</div><div><strong>Listen · notice · sort</strong><span>В этом блоке декоративная картинка не нужна: здесь главное — звуки, слова и сортировка. Распредели слова по трём колонкам.</span></div></div><div class="bins">${bins.map(([k,l,h])=>`<div class="bin" data-bin="${k}"><strong>${l}</strong><small>${h}</small><div class="binwords">${order.map(i=>{const x=data.sounds[i];return state.answers.sounds[i]?.solved&&x.a===k?`<button class="wordChip good" disabled>${esc(x.w)}</button>`:''}).join('')}</div></div>`).join('')}</div><div class="wordBank">${order.map(i=>{const x=data.sounds[i];return !state.answers.sounds[i]?.solved?`<button draggable="true" class="wordChip ${state.selectedSort===i?'selected':''}" data-word="${i}">${esc(x.w)}</button>`:''}).join('')}<span id="sortHint" class="audioMeta">${done?'Все слова распределены верно':'Нажми слово и затем колонку — или перетащи карточку'}</span></div><div class="footerActions"><div class="leftActions">${audioBtn('soundAudio','Примеры')}</div><button class="nextBtn" id="next" ${done?'':'disabled'}>Следующий блок →</button></div></div>`);function place(i,bin){const x=data.sounds[i];let a=state.answers.sounds[i]||{attempts:0,firstCorrect:null,solved:false};a.attempts++;const ok=x.a===bin;if(a.firstCorrect===null)a.firstCorrect=ok;if(ok){a.solved=true;state.selectedSort=null}state.answers.sounds[i]=a;save();if(ok)render();else{const h=document.getElementById('sortHint');h.textContent='Не эта колонка. Послушай примеры ещё раз.';h.style.color='#bd4053'}}document.querySelectorAll('[data-word]').forEach(w=>{const i=+w.dataset.word;w.onclick=()=>{state.selectedSort=i;save();render()};w.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'}});document.querySelectorAll('[data-bin]').forEach(b=>{b.onclick=()=>{if(state.selectedSort!==null)place(state.selectedSort,b.dataset.bin)};b.ondragover=e=>{e.preventDefault();b.classList.add('dropTarget')};b.ondragleave=()=>b.classList.remove('dropTarget');b.ondrop=e=>{e.preventDefault();b.classList.remove('dropTarget');const i=+e.dataTransfer.getData('text/plain');if(Number.isInteger(i))place(i,b.dataset.bin)}});document.getElementById('soundAudio').onclick=function(){if(this.classList.contains('busy')){stopAudio();this.classList.remove('busy');this.textContent='▶ Примеры'}else speak(['euro, Europe, European','centre, city, cents','coffee, Coke, card, can'],this,'Примеры')};document.getElementById('next').onclick=()=>{state.screen=3;save();render()}}

function menu(){const left=`<div class="mediaTextRow menuSceneRow"><div class="sceneImageCard"><img src="assets/images/block3-menu.png" alt="Lunch menu café scene"></div><div class="menuBoard"><h4>Lunch menu</h4><div class="menuList">${data.menu.map(x=>`<div class="menuRow"><span>${esc(x.item)}</span><span>${esc(x.price)}</span></div>`).join('')}</div></div></div>`;simpleQuiz('menu',3,'Lunch Menu Explorer','asking and answering about prices',left,['How much is an orange juice?','A chicken pie is five pounds thirty-five.','How much is a cheese sandwich?'],4)}

function rob(){const left=`<div class="dialogueMediaRow"><div class="sceneImageCard dialoguePhoto"><img src="assets/images/block4-rob.png" alt="Rob ordering lunch at a pub counter"></div><div class="scriptCard compactScript"><h4>Rob buys lunch</h4>${data.rob.lines.map(x=>`<p>${esc(x)}</p>`).join('')}</div></div>`;simpleQuiz('rob',4,'Buying Lunch: Rob','ordering food and drink politely',left,data.rob.lines,5)}

function jenny(){const paras=[
  'Assistant: Hi. How can I help you? Jenny: Hi. How much is this tuna salad? Assistant: It’s seven twenty. Jenny: OK, fine. And this mineral water, please. Assistant: That’s nine dollars seventy cents.',
  'Amy: Jenny! ... We can have lunch together in the park. Jenny: Sure! Great idea.',
  'Amy: Can I have a cheese sandwich, a cappuccino, and a brownie, please?'
];const left=`<div class="dialogueMediaRow"><div class="sceneImageCard dialoguePhoto"><img src="assets/images/block5-jenny.png" alt="Jenny and Amy at a New York deli"></div><div class="scriptCard compactScript"><h4>Jenny & Amy in the deli</h4>${paras.map(x=>`<p>${esc(x)}</p>`).join('')}</div></div>`;simpleQuiz('jenny',5,'Jenny & Amy','a short deli dialogue',left,paras,6)}

function memory(){
  const needsOrder=!Array.isArray(state.memoryOrder)||state.memoryOrder.length!==data.memory.length*2||state.memoryOrder.some(c=>!c.lang);
  if(needsOrder){
    state.memoryOrder=shuffle(data.memory.flatMap((p,i)=>[
      {pair:i,text:p.a,lang:'en'},
      {pair:i,text:p.b,lang:'ru'}
    ]));
    state.memoryOpen=[];
    state.memoryMoves=0;
    state.memoryWrong=false;
    save();
  }
  const solvedCount=Object.values(state.answers.memory||{}).filter(x=>x.solved).length;
  const all=data.memory.every((_,i)=>state.answers.memory[i]?.solved);
  const selected=Array.isArray(state.memoryOpen)?state.memoryOpen:[];
  const feedback=state.memoryWrong?'Не пара. Попробуй ещё раз.':selected.length===1?'Теперь выбери карточку на другом языке.':'Выбери английскую и русскую карточки с одинаковым значением.';
  app.innerHTML=shell(`${title(6,'Find the Pair','English phrase ↔ Russian meaning')}<div class="leftPanel memoryPanel pairPanel"><div class="pairIntro"><div><b>Найди пару</b><span>Все карточки открыты. Английские фразы — синие, русские — фиолетовые. Нажми одну карточку каждого цвета.</span></div><div class="pairLegend"><span class="legendEn">English</span><span class="legendRu">Русский</span></div></div><div class="memoryWrap pairWrap">${state.memoryOrder.map((c,idx)=>{const matched=state.answers.memory[c.pair]?.solved;const isSelected=selected.includes(idx);const wrong=state.memoryWrong&&isSelected;return `<button class="memoryCard pairCard ${c.lang==='en'?'englishCard':'russianCard'} ${matched?'matched':isSelected?'selected':''} ${wrong?'wrong':''}" data-mem="${idx}" ${matched?'disabled':''}>${esc(c.text)}</button>`}).join('')}</div><div class="pairStatus ${state.memoryWrong?'badStatus':''}">${feedback}</div><div class="memoryMeta"><span>Найдено пар: ${solvedCount}/${data.memory.length}</span><span>Попыток: ${state.memoryMoves||0}</span></div><div class="footerActions"><div class="leftActions"><button class="ghostBtn" id="reshuffle">Перемешать</button></div><button class="nextBtn" id="next" ${all?'':'disabled'}>Следующий блок →</button></div></div>`);

  document.querySelectorAll('[data-mem]').forEach(btn=>btn.onclick=()=>{
    const idx=+btn.dataset.mem;
    const card=state.memoryOrder[idx];
    if(state.answers.memory[card.pair]?.solved)return;
    if(state.memoryWrong)return;

    let open=Array.isArray(state.memoryOpen)?[...state.memoryOpen]:[];
    if(open.includes(idx)){
      state.memoryOpen=[];
      save();
      render();
      return;
    }

    if(open.length===0){
      state.memoryOpen=[idx];
      save();
      render();
      return;
    }

    const firstIdx=open[0];
    const first=state.memoryOrder[firstIdx];
    if(first.lang===card.lang){
      state.memoryOpen=[idx];
      save();
      render();
      return;
    }

    state.memoryMoves=(state.memoryMoves||0)+1;
    state.memoryOpen=[firstIdx,idx];
    if(first.pair===card.pair){
      state.answers.memory[card.pair]={solved:true,firstCorrect:true};
      state.memoryOpen=[];
      state.memoryWrong=false;
      save();
      render();
    }else{
      state.memoryWrong=true;
      save();
      render();
      setTimeout(()=>{
        state.memoryOpen=[];
        state.memoryWrong=false;
        save();
        render();
      },700);
    }
  });

  document.getElementById('reshuffle').onclick=()=>{
    state.memoryOrder=shuffle(data.memory.flatMap((p,i)=>[
      {pair:i,text:p.a,lang:'en'},
      {pair:i,text:p.b,lang:'ru'}
    ]));
    state.memoryOpen=[];
    state.memoryWrong=false;
    state.memoryMoves=0;
    save();
    render();
  };
  document.getElementById('next').onclick=()=>{state.screen=7;save();render()};
}

function phrases(){const left=`<div class="phrasePanel"><h4 style="margin:0 0 10px">Useful phrases</h4><div class="priceList"><div class="priceRow"><span>Can I have …, please?</span><span>order politely</span></div><div class="priceRow"><span>Anything else?</span><span>offer more</span></div><div class="priceRow"><span>How much is it?</span><span>ask the price</span></div><div class="priceRow"><span>Here you are.</span><span>give money / an item</span></div><div class="priceRow"><span>Here’s your change.</span><span>return money</span></div><div class="priceRow"><span>Have a nice day.</span><span>finish politely</span></div></div></div>`;simpleQuiz('phrases',7,'Useful Phrases','natural phrases for cafés, pubs, and delis',left,['Can I have an orange juice, please?','Anything else?','How much is it?','Here you are.','Here\'s your change.','Have a nice day.'],8)}

function results(){
 const keys=ORDER;
 const totalMax=keys.reduce((n,k)=>n+MAX[k],0);
 const total=keys.reduce((n,k)=>n+score(k),0);
 const pct=totalMax?Math.round(total/totalMax*100):0;
 const sorted=[...keys].sort((a,b)=>(score(b)/MAX[b])-(score(a)/MAX[a]));
 const best=sorted[0],weak=sorted.at(-1);
 const weakPerfect=score(weak)===MAX[weak];
 app.innerHTML=shell(`
   <div class="resultTitlebar">
     <div class="resultTitlewrap"><h1>Your <span>Results</span></h1><p>Beginner · Practical English · Episode 2 · Can I have an orange juice, please?</p></div>
     <div class="resultProgressBox"><strong>Готово</strong><div class="resultTrack"><i></i></div></div>
   </div>
   <div class="resultsClassic">
     <div class="resultRing" style="--pct:${pct}"><strong>${pct}%</strong><span>с первого раза</span></div>
     <div class="resultDetails">
       <div class="resultListClassic">${keys.map(k=>{const p=Math.round(score(k)/MAX[k]*100);return `<div class="resultRowClassic"><label>${esc(LABELS[k])}</label><div class="resultBarClassic"><i style="width:${p}%"></i></div><b>${score(k)}/${MAX[k]}</b></div>`}).join('')}</div>
       <div class="resultCoach">
         <div><strong>Сильнее всего</strong><p>${esc(LABELS[best])} — лучший результат с первой попытки.</p></div>
         <div><strong>${weakPerfect?'Отличная работа':'Что повторить'}</strong><p>${weakPerfect?'Все блоки выполнены уверенно. Можно переходить дальше.':`${esc(LABELS[weak])} — этот блок стоит пройти ещё раз.`}</p></div>
       </div>
       <div class="resultButtons"><button class="btn primary" id="restart">Пройти ещё раз</button><button class="btn secondary" id="home">На главную</button></div>
     </div>
   </div>`);
 document.getElementById('restart').onclick=()=>{state=fresh();state.screen=1;save();render()};
 document.getElementById('home').onclick=()=>{state.screen=0;save();render()};
}

function render(){stopAudio();({0:start,1:prices,2:sounds,3:menu,4:rob,5:jenny,6:memory,7:phrases,8:results}[state.screen]||start)()}
render();

</script>
<script>
/* WOW SCHOOL v4 retrofit layer. Educational app logic remains in the original app.js. */
const WOW_V4_HELPERS={
  1:{title:"Простое правило",html:"В цене сначала называй pounds / euros / dollars, затем оставшуюся часть: <b>six pounds seventy-five</b>."},
  3:{title:"Лёгкая подсказка",html:"Сначала найди нужный item в меню, затем сравни его цену с вариантами ответа."},
  4:{title:"Лёгкая подсказка",html:"Следи за функцией реплики: заказать, добавить ещё что-то, спросить цену или передать деньги."},
  7:{title:"Лёгкая подсказка",html:"Выбирай фразу, которая естественно подходит ситуации: order → extra item → price → payment → goodbye."}
};
const WOW_V4_TRANSCRIPT=null;
function wowV4Esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function wowV4HelperDetails(title,html){return `<details class="helperDetails"><summary>${wowV4Esc(title)}</summary><div class="helperBody">${html}</div></details>`}
function wowV4NormalizeLine(line,i,roles){
 let speaker='',text='';
 if(typeof line==='string'){
   const m=line.match(/^([^:]+):\s*(.*)$/);
   if(m&&m[1].length<=32){speaker=m[1].trim();text=m[2].trim()}else text=line;
 }else if(line&&typeof line==='object'){
   speaker=line.speaker||line.voice||line.name||'';text=line.text||line.line||'';
 }
 if(!speaker)speaker=(roles&&roles.length?roles[i%roles.length]:`Speaker ${i%2+1}`);
 return {speaker,text};
}
function wowV4TranscriptLines(){
 const c=WOW_V4_TRANSCRIPT;if(!c)return [];
 try{
   const sec=c.section,src=data[sec],roles=c.roles||[];
   let lines=[];
   if(c.kind==='scripts'){
     const idx=(state.idx&&state.idx[sec])||0,item=src.qs[idx],sid=item&&item.script;
     const script=src.scripts.find(s=>s.id===sid)||src.scripts[0];lines=script?.lines||[];
   }else if(c.kind==='lines')lines=src.lines||[];
   else if(c.kind==='transcript')lines=src.transcript||[];
   else if(c.kind==='array-script'){
     const idx=(state.idx&&state.idx[sec])||0;lines=src[idx]?.script||[];
   }else if(c.kind==='array-lines'){
     const idx=(state.idx&&state.idx[sec])||0;lines=src[idx]?.lines||[];
   }
   return lines.map((x,i)=>wowV4NormalizeLine(x,i,roles)).filter(x=>x.text);
 }catch(_){return []}
}
function wowV4TranscriptHTML(){
 const lines=wowV4TranscriptLines();if(!lines.length)return '';
 return `<div class="transcript">${lines.map(x=>`<div class="transcriptLine"><strong>${wowV4Esc(x.speaker)}</strong><span>${wowV4Esc(x.text)}</span></div>`).join('')}</div>`;
}
function wowV4ApplyHelpers(){
 const screen=state?.screen||0;
 const details=[];
 const h=WOW_V4_HELPERS[screen];if(h)details.push(wowV4HelperDetails(h.title,h.html));
 if(WOW_V4_TRANSCRIPT&&screen===WOW_V4_TRANSCRIPT.screen){
   const t=wowV4TranscriptHTML();if(t)details.push(wowV4HelperDetails('Открыть текст диалога',t));
 }
 if(!details.length)return;
 const body=document.querySelector('.blockBody');
 const visual=body&&Array.from(body.children).find(el=>el.classList?.contains('visualCard'));
 if(body&&visual){
   const column=document.createElement('div');column.className='visualColumn';
   body.insertBefore(column,visual);column.appendChild(visual);
   const wrap=document.createElement('div');wrap.className='visualHelpers';wrap.innerHTML=details.join('');column.appendChild(wrap);return;
 }
 const left=document.querySelector('.layout .leftPanel');
 if(left){
   const wrap=document.createElement('div');wrap.className='visualHelpers';wrap.innerHTML=details.join('');
   const footer=left.querySelector('.footerActions');if(footer)left.insertBefore(wrap,footer);else left.appendChild(wrap);
 }
}
if(typeof render==='function'){
 const wowV4BaseRender=render;
 render=function(){wowV4BaseRender();wowV4ApplyHelpers()};
 wowV4ApplyHelpers();
}

function wowV4Sections(){
  try{if(typeof SECTIONS!=='undefined'&&Array.isArray(SECTIONS))return SECTIONS}catch(_){}
  try{if(typeof ORDER!=='undefined'&&Array.isArray(ORDER))return ORDER}catch(_){}
  return [];
}
function wowV4QaChangeTask(delta){
  const sections=wowV4Sections(),sec=sections[(state.screen||0)-1];
  if(!sec||!state.idx||!(sec in state.idx))return;
  let total=0;try{total=MAX[sec]||0}catch(_){}
  if(!total)return;
  const cur=state.idx[sec]||0,next=Math.max(0,Math.min(total-1,cur+delta));
  if(next===cur)return;
  state.idx[sec]=next;
  if('builderChosen' in state)state.builderChosen=[];
  if('selectedSort' in state)state.selectedSort=null;
  if(typeof save==='function')save();
  if(typeof render==='function')render();
}
function wowV4QaChangeBlock(delta){
  const sections=wowV4Sections(),last=sections.length;if(!last)return;
  const current=state.screen>=1&&state.screen<=last?state.screen:(delta>0?0:last+1);
  const next=Math.max(1,Math.min(last,current+delta));if(next===state.screen)return;
  state.screen=next;
  if('builderChosen' in state)state.builderChosen=[];
  if('selectedSort' in state)state.selectedSort=null;
  if(typeof save==='function')save();
  if(typeof render==='function')render();
}
addEventListener('keydown',e=>{
  if(document.querySelector('.wow-pin-gate'))return;
  if(e.altKey&&e.shiftKey&&!e.ctrlKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();wowV4QaChangeTask(e.key==='ArrowRight'?1:-1);return}
  if(e.altKey&&e.ctrlKey&&!e.shiftKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();wowV4QaChangeBlock(e.key==='ArrowRight'?1:-1)}
});


</script>
